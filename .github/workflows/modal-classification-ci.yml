name: modal-classification-ci
on:
  push:
    branches: [fix/local-distortional-classification]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install numpy scipy matplotlib
      - run: python -m unittest test_modal_report test_modal_visuals test_modal_validation test_dsm_modal_audit
