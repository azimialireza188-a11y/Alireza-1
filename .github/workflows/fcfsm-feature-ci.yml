name: Feature branch Python tests
on:
  push:
    branches:
      - feat/fcfsm-mechanical-modal-classifier
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy scipy matplotlib
      - run: python -m unittest test_progress.py test_resource_policy.py test_modal_archive.py test_reference_section.py test_fcfsm_reference_basis.py test_modal_harmonics.py test_complete_pipeline.py -v
